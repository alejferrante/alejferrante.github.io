reviews:
  - author: Elena Bastelli
    source: ''
    text:
      en: 'The painting of the artist Ferrante is not merely an image of things; above all, it is an inner stirring that perceives the mysterious meaning of reality and transforms it into color, form, and symbol. Each of the artist’s works is a poem—a journey born of the emotional impulse of artistic creation—balanced upon the coexistence of linguistic and chromatic elements. The individual dimension is interpreted within the material universe, immortalized on canvas as a moment of absolute representation, as a metonymy—a part standing in for the whole. Footprints, shoes, hats, extinguished cigarettes, records, musical staves: these represent the men, women, music, desires, expectations, vitality, anger, nostalgia, and love that the artist presents to us. The depiction serves to characterize an inner resonance—the painter’s own perception of reality.'
      it: 'La pittura dell’artista Ferrante non è solo immagine delle cose, ma è soprattutto commozione interiore che percepisce il significato misterioso della realtà e lo trasforma in colore, forma e simbolo. Ogni opera dell’artista è una poesia, un viaggio testuale nato dalla spinta emotiva della creazione artistica, bilanciato sulla compresenza di elementi linguistici ed elementi cromatici . La dimensione individuale viene interpretata all’interno dell’universo materiale, immortalata sulla tela come attimo di rappresentazione assoluta, come metonimia, parte che rappresenta il tutto. Orme, scarpe, cappelli, sigarette spente, dischi, pentagrammi: sono gli uomini, le donne, le musiche, i desideri, le attese, la vitalità, la rabbia, la nostalgia e l’amore che l’artista ci presenta. La raffigurazione è la caratterizzazione della rispondenza interiore, della percezione della realtà del pittore.'
      es: 'La pintura del artista Ferrante no es meramente una imagen de las cosas; es, ante todo, una conmoción interior que percibe el sentido misterioso de la realidad y lo transforma en color, forma y símbolo. Cada una de las obras del artista es un poema —un viaje nacido del impulso emocional de la creación artística— que se equilibra en la coexistencia de elementos lingüísticos y cromáticos. La dimensión individual se interpreta dentro del universo material, inmortalizada sobre el lienzo como un instante de representación absoluta, como una metonimia: una parte que representa el todo. Huellas, zapatos, sombreros, cigarrillos apagados, discos, pentagramas: estos elementos representan a los hombres, las mujeres, la música, los deseos, las expectativas, la vitalidad, la ira, la nostalgia y el amor que el artista nos presenta. La representación sirve para caracterizar una resonancia interior: la percepción misma que el pintor tiene de la realidad.'
  - author: Ibrahim Kodra
    source: ''
    text:
      en: 'Alejandro Ferrante’s painting is “psychopainting.” In the Freudian sense, psychopainting originates in the unconscious: the painter projects his deep-seated drives into the artwork and presents it to the world, allowing the viewer to become aware of—and personally discover—its true meaning.'
      it: 'La pittura di Alejandro Ferrante è “Psicopittura”.  Cosi secondo Freud la psicopittura nasce dall’inconscio: il pittore proietta le propie pulsioni profonde nell’ opera d’arte e la presenta al mondo perchè questi possa assumere la coscienza di incontrare per se stesso il suo vero significato.'
      es: 'La pintura de Alejandro Ferrante es «psicopintura». En el sentido freudiano, la psicopintura se origina en el inconsciente: el pintor proyecta sus pulsiones más profundas en la obra y la presenta al mundo, permitiendo que el espectador tome conciencia de su verdadero significado —y lo descubra personalmente—.'
  - author: Andrea Coppini
    source: ''
    text:
      en: |-
        His painting is strikingly original. Ferrante’s stylistic signature lies in a rich universe of objects, figures, silhouettes, and two-dimensional representations combined with three-dimensional inserts; these are complemented by inscriptions, phrases penned in minute script, and poetry that integrate and complete the essence of the objects.
        All of this is layered over backgrounds with an *Informel* aesthetic—intense, vividly colored, and charged with tension and evocative power.
        Symbols intertwine to give rise to new motifs—fresh allusions inviting deep contemplation and total immersion in the quest for full understanding.
      it: |-
        La sua pittura è particolarmente originale. La cifra stilistica di Ferrante è costituita da un ricco universo di oggetti, figure, silhouette, rappresentazioni bidimensionali unite a inserti tridimensionali; a questi si aggiungono iscrizioni, frasi vergate con una grafica minuta, poesia che vanno a integrare e a completare l’essenza degli oggetti.
        Il tutto sovrapposto a fondali di gusto informale, matrici, violenti nelle cromie utilizzate, saturi di tensioni e suggestioni.
        Le simbologie si intersecano e danno vita a nuovi motivi. Nuove allusioni, da meditare e in cui immergersi completamente, alla ricerca di una comprensione piena.
      es: |-
        Su pintura es sorprendentemente original. El sello estilístico de Ferrante reside en un rico universo de objetos, figuras, siluetas y representaciones bidimensionales combinadas con elementos tridimensionales; todo ello se complementa con inscripciones, frases trazadas con letra menuda y poesía que integran y completan la esencia de los objetos.
        El conjunto se superpone a fondos de estética informalista: intensos, de colores vivos y cargados de tensión y poder evocador.
        Los símbolos se entrelazan para dar lugar a nuevos motivos: alusiones frescas que invitan a una profunda contemplación y a una inmersión total en la búsqueda de una comprensión plena.
  - author: Paola Maria Vajani
    source: ''
    text:
      en: |-
        In his works, Ferrante portrays music and passion. He does so with all the joy and yearning he holds within. Above all, he communicates them in a unique and surprising way, casting an invisible bridge between himself and the audience—an embrace steeped in emotion, capable of conveying every fluctuation of his soul.
        Colors blend with other, unexpected elements—such as paper, glass, rope, or poetry. The paintings thus evolve into true sculptures, magically claiming a new dimension as they burst forth from the flat surface.
      it: |-
        Nelle sue opere, Ferrante dipinge la musica e la passione. Lo fa con tutta la gioia e lo struggimento che ha dentro. Soprattutto li comunica, in modo unico e sorprendente, gettando un ponte invisibile tra se e il pubblico, un abbraccio che si intride di sentimento, capace di trasmettere ogni fluttuazione della sua anima. 
        I colori si mescolano con altri elementi, inaspettati, come carta, vetro,  corda o poesia. I quadri si evolvono così in vere sculture e magicamente conquistano una nuova dimensione, uscendo irruenti dal piano.
      es: |-
        En sus obras, Ferrante plasma la música y la pasión. Lo hace con toda la alegría y el profundo anhelo que alberga en su interior. Sobre todo, las transmite de una manera única y sorprendente, tendiendo un puente invisible entre él y el público: un abrazo cargado de emoción, capaz de expresar cada matiz de su alma.
        Los colores se funden con otros elementos inesperados, como papel, vidrio, cuerda o poesía. Así, las pinturas evolucionan hasta convertirse en verdaderas esculturas, adquiriendo mágicamente una nueva dimensión al emerger de la superficie plana.
  - author: Antonella Ferrari
    source: ''
    text:
      en: |-
        Alejandro’s most recent works trace a painterly path that is becoming increasingly ethereal, shifting towards a greater focus on the abstraction of geometric forms. His original training as an architect is perhaps resurfacing more visibly; the drawing pays closer attention to the construction of precise symmetries and asymmetries, recalling academic exercises in analytic geometry. At times, the composition reproduces a three-dimensional form seemingly derived from the metaphysical geometries of Luca Pacioli; at others, simple elements defined by lines and curves balance across the canvas, enriched by decorative fabric inserts.
        Overlaid upon this rigorous structure is the element of the unexpected—passion and color—layering freely and fluidly across the drawing’s surface, overlapping and spilling beyond the precisely defined shapes. The magic and allure of these paintings lie in the tension created between "reason" and "feeling."
      it: |-
        Le opere più recenti di Alejandro delineano un percorso pittorico che si va sempre più rarefacendo, volgendosi verso un maggiore interesse all’astrazione delle forme geometriche. La sua formazione originaria di architetto sta forse tornando a galla in una forma più evidente, il disegno è più attento alla costruzione di simmetrie ed asimmetrie precise rimandando alle esercitazioni scolastiche di geometria analitica. A volte il disegno riproduce una forma tridimensionale che sembra derivare dalle geometrie metafisiche di Luca Pacioli, a volte invece gli elementi semplici definiti da linee e curve si dispongono bilanciandosi sulla tela  arricchendosi con inserti decorativi in tessuto.  
        A questo impianto rigoroso si sovrappone l’imprevisto, la passione, il colore che si stratifica sulla superficie del disegno in modo libero e liquido, sovrapponendosi e colando fuori dalle forme così precisamente delineate. Nella tensione che si crea tra “ragione” e “sentimento” è racchiusa la magia e il fascino di questi quadri.
      es: |-
        Las obras más recientes de Alejandro trazan una trayectoria pictórica que se vuelve cada vez más etérea, orientándose hacia un mayor énfasis en la abstracción de formas geométricas. Quizás esté aflorando con mayor claridad su formación original como arquitecto; el dibujo presta especial atención a la construcción de simetrías y asimetrías precisas, evocando ejercicios académicos de geometría analítica. En ocasiones, la composición reproduce una forma tridimensional que parece derivar de las geometrías metafísicas de Luca Pacioli; en otras, elementos sencillos definidos por líneas y curvas se equilibran sobre el lienzo, enriquecidos por inserciones de telas decorativas.
        Sobre esta estructura rigurosa se superpone el elemento de lo inesperado —pasión y color—, que se despliega con libertad y fluidez por la superficie del dibujo, solapándose y desbordando los contornos definidos con precisión. La magia y el atractivo de estas pinturas residen en la tensión creada entre la «razón» y el «sentimiento».
  - author: Elena Ulacco
    source: ''
    text:
      en: |-
        His painting is bold and passionate—rigorous and minimalist in form, yet intense in emotional substance. 
        It is a style of painting that seeks not to describe, but to stir emotions, unsettle, provoke, and communicate through the sensations it evokes in the viewer. In this sense, Ferrante views art as life, dynamism, emotion, and freedom—qualities best expressed through abstract subjects and the refusal to rely on a single compositional technique. 
        The artist does not begin with a preconceived idea; instead, he allows the paint to flow freely across the canvas, creating random drips that suggest a subject and lend themselves to multiple interpretations, shaped by the viewer's imagination.
        The large scale of his works serves as an invitation to the spectator to step—as if through a doorway—into a journey of discovery.
        Echoes of his homeland frequently appear—such as references to tango and its world—yet his work transcends this, expressing timeless passions.
        Feedback
      it: |-
        La sua pittura è forte e passionale, rigorosa e minimale nelle forme ma intensa nella sostanza emotiva. 
        Una pittura che non vuole descrivere, ma emozionare, turbare, provocare, comunicare attraverso le sensazioni che suscita nell’osservatore. In questo senso Ferrante intende l’arte, come vita, dinamismo, emozione, libertà, che meglio si esprime attraverso soggetti astratti e attraverso la rinuncia all’utilizzo di un’unica tecnica compositiva. 
        L’artista non parte da un’idea, ma lascia che il colore, fatto colare liberamente sulla tela, disegni sgocciolature casuali che gli suggeriscano un soggetto e che si prestino a molteplici interpretazioni, secondo la fantasia dell’osservatore.
         Il grande formato delle sue opere è un invito rivolto allo spettatore, perché entri, come attraverso una porta, in un percorso di scoperta.
        Frequenti sono le suggestioni della sua terra, come i richiami al tango e al suo mondo, ma la sua opera va oltre nell’espressione di passioni senza tempo.
      es: |-
        Su pintura es audaz y apasionada: rigurosa y minimalista en la forma, pero intensa en su carga emocional.
        Es un estilo pictórico que no busca describir, sino conmover, inquietar, provocar y comunicar a través de las sensaciones que despierta en el espectador. En este sentido, Ferrante concibe el arte como vida, dinamismo, emoción y libertad; cualidades que se expresan mejor mediante temas abstractos y el rechazo a depender de una única técnica compositiva.
        El artista no parte de una idea preconcebida; por el contrario, permite que la pintura fluya libremente sobre el lienzo, creando chorreaduras aleatorias que sugieren un motivo y se prestan a múltiples interpretaciones, moldeadas por la imaginación del espectador.
        La gran escala de sus obras invita al espectador a adentrarse —como si cruzara un umbral— en un viaje de descubrimiento.
        A menudo surgen ecos de su tierra natal —como referencias al tango y su universo—, pero su obra trasciende este ámbito para expresar pasiones atemporales.
  - author: Cristina Gilda Artese
    source: ''
    text:
      en: |-
        Alejandro Juan Ferrante possesses an eclectic artistic personality, shaped and rooted both in his architectural studies at the University of Mar del Plata and his time spent learning from Argentine master painters.  
        Ferrante’s palette—characterized by deep, often primary, and vibrant colors—carries the weight of all his lives, past and present; the three-dimensional quality of his compositions reflects his existential journey across Argentina, Italy, and the United States.  
        For Ferrante, each canvas—rich in texture and color—serves as an intimate narrative of episodes from his life: moments defined by dance, music, encounters, and freedom.  
        Within every work, emotions tinged with melancholy and nostalgia intertwine with joy and the thrill of discovery—a testament to a past that never fades, built layer upon layer through the accumulation of lived moments.  
        To bring order to the canvas, some works incorporate lines and predominantly geometric forms, symbolically evoking that sense of stability, substance, and security that every human being seeks deep within.  
        Thus emerges a triumph of improvisation—a shifting of planes, a sudden change in direction—a final, transformative element that embodies revolution, freedom, life, and beauty. This becomes the common thread, the hallmark, of Ferrante’s art.
      it: |-
        La personalità artistica di Alejandro Juan Ferrante è di tipo eclettico, essendosi formata e radicata sia negli studi alla facoltà di architettura all’Università di Mar del Plata che a la frequentazione di maestri pittori argentini.  
        La tavolozza di Ferrante, dai colori profondi, spesso primari, e vibranti, si porta dietro tutte le sue vite, passate e presenti, e gli scenari dall’effetto tridimensionale delle opere accolgono le sue esperienze esistenziali tra Argentina, Italia e Stati Uniti.  
        Ogni tela, intrisa di materia e di colore, per Ferrante rappresenta il racconto intimo di episodi della sua vita, di momenti della sua storia, fatta di ballo, di musica, di incontri, di libertà.     
        In ogni tela si sovrappongono emozioni dai toni melanconici e nostalgici insieme a gioia e scoperta per la memoria di un passato che non si cancella mai e che si è formato, strato dopo strato, uno sopra l’altro, di attimi presenti.    
        A riportare ordine sulla tela, appaiono in alcune opere delle linee e delle forme per lo più geometriche che riconducono simbolicamente a quella dimensione di stabilità, di concretezza e di sicurezza che ogni essere umano in cuor suo ricerca.  
        Ecco allora il trionfare dell’improvvisazione, il ribaltamento dei piani, il cambio di marcia, quella variante finale che davvero è espressione di rivoluzione, di libertà, di vita e di bellezza e che diventa per Ferrante il fattor comune denominatore, il segno distintivo, della sua arte.
      es: |-
        Alejandro Juan Ferrante posee una personalidad artística ecléctica, forjada y arraigada tanto en sus estudios de arquitectura en la Universidad de Mar del Plata como en su etapa de aprendizaje junto a maestros pintores argentinos.  
        La paleta de Ferrante —caracterizada por colores profundos, a menudo primarios y vibrantes— carga con el peso de todas sus vidas, pasadas y presentes; la cualidad tridimensional de sus composiciones refleja su periplo existencial a través de Argentina, Italia y Estados Unidos.  
        Para Ferrante, cada lienzo —rico en texturas y color— funciona como una narrativa íntima de episodios de su vida: momentos definidos por la danza, la música, los encuentros y la libertad.  
        En cada obra, emociones teñidas de melancolía y nostalgia se entrelazan con la alegría y la emoción del descubrimiento; es el testimonio de un pasado que nunca se desvanece, construido capa sobre capa mediante la acumulación de momentos vividos.  
        Para dotar de orden al lienzo, algunas de sus obras incorporan líneas y formas predominantemente geométricas, evocando simbólicamente esa sensación de estabilidad, solidez y seguridad que todo ser humano busca en su interior.  
        Así surge un triunfo de la improvisación —un desplazamiento de planos, un cambio repentino de dirección—, un elemento final y transformador que encarna la revolución, la libertad, la vida y la belleza. Esto se convierte en el hilo conductor, el sello distintivo del arte de Ferrante.
