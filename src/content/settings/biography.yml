text:
  en: |-
    Alejandro Juan Ferrante was born in Mar del Plata, Argentina, in 1956.

    He attended Primary School No. 1 Pascuala Mugaburu and went on to secondary school at the Escuela Comercial Mariano Moreno in Mar del Plata.

    He enrolled in the Faculty of Architecture and Urban Planning and graduated as an architect in 1984. While at university he took a photography course at the Mar del Plata Academy of Photography and took part in a number of exhibitions, gatherings and competitions. He won first prize for his work *Una ventana al pasado*, awarded by a jury of architects, and first prize for *Soledad*, awarded by a jury of photographers.

    In Argentina he practised as an architect, designing and overseeing building projects both small and large, and taught at the University of Architecture and Urban Planning in Mar del Plata.

    In 1988 he moved to Buenos Aires for architectural projects and began to devote himself to painting. In the same period his passion for tango, its dance and its culture, was born: he studied it for years, and it profoundly shaped his painting.

    Back in Mar del Plata, he carried on with all his artistic and cultural activity.

    At the end of 2000 and the beginning of 2001, as an Italian citizen, he brought his knowledge of architecture, tango and painting to Italy and settled in Milan. There he began a cultural life that would span almost 30 years.

    In Milan he worked as an architect and as a tango teacher, staging performances in the city's theatres and teaching tango in various cultural venues.

    As a painter he has exhibited in galleries, museums and cultural centres under the patronage of the Argentine Consulate in Milan, with which he continues to collaborate closely on cultural projects.

    His painting has earned him a number of honours and awards:

    - Since 2009 his painting *El tormento del fueye* has been on permanent display at the Aroldo Bonzagni Gallery of Modern Art in Cento (Ferrara).
    - Since 2011 his work *El tango de Argentina al mundo* has been on display at the Consulate of the Argentine Republic in Milan.
    - In 2006 he won third prize for *El duelo* at the exhibition *Arte sul Naviglio* in Milan.
    - In 2011 he received a plaque of recognition for promoting Argentine culture in Milan, presented by the Mayor, Letizia Moratti.
    - In 2012 the Ambassador and Consul of Argentina in Milan, Gustavo Moreno, awarded him a medal of recognition for his art and for promoting Argentine culture in Milan.
    - In 2012 he won first prize at the 5th Symposium Milano Art Festival International with his work *Buenos Aires, Paris, Buenos Aires*.
    - In 2025 the Ambassador and Consul of Argentina in Milan, Luis Pablo Niscovolos, presented him with a certificate of recognition for his 25 years as a representative of Argentine culture in Italy, for his painting and for promoting Argentine tango.

    In 2026, longing for his loved ones and his home town, he decided to return permanently to Mar del Plata, where he will carry on his artistic life and future art projects, bringing with him much of what he lived in Europe, above all in Milan.
  it: |-
    Alejandro Juan Ferrante nasce a Mar del Plata, in Argentina, nel 1956.

    Frequenta la Scuola Primaria n. 1 Pascuala Mugaburu;  prosegue gli studi secondari alla Scuola Commerciale Mariano Moreno di Mar del Plata e si laurea in architettura nel 1984 alla Facultà di Architettura e Urbanistica di Mar del Plata.

    Durante gli studi segue un corso di fotografia all'Accademia di Fotografia di Mar del Plata e partecipa a diverse mostre, incontri e concorsi. Ottiene il primo premio per l'opera _Una ventana al pasado_, assegnato da una giuria di architetti, e il primo premio per l'opera _Soledad_, conferito da una giuria di fotografi.

    In Argentina esercita la professione di architetto, progettando e dirigendo diverse opere architettoniche e insegna all'Università di Architettura e Urbanistica di Mar del Plata.

    Nel 1988 si trasferisce a Buenos Aires per alcuni progetti architettonici e inizia a dedicarsi alla pittura. Negli stessi anni nasce la sua passione per il ballo e la cultura del tango, che studia per anni e che influenza profondamente la sua espressione pittorica.

    Tornato a Mar del Plata, prosegue tutta la sua attività artistica e culturale.

    Tra la fine del 2000 e l'inizio del 2001, possedendo già la cittadinanza italiana, va in Italia e si stabilisce a Milano.

    A Milano lavora come architetto e come maestro di tango, realizzando spettacoli nei teatri della città e insegnando tango in diversi spazi culturali.

    Come pittore espone in gallerie, musei e centri culturali con il patrocinio del Consolato Argentino di Milano, con cui continua a collaborare assiduamente in ambito culturale.

    In pittura ottiene diversi riconoscimenti e premi:

    - Il dipinto _El tormento del fueye_ è esposto in modo permanente dal 2009 alla Galleria d'Arte Moderna Aroldo Bonzagni di Cento (Ferrara).
    - L'opera _El tango de Argentina al mundo_ è esposta dal 2011 al Consolato della Repubblica Argentina a Milano.
    - Nel 2006, alla mostra _Arte sul Naviglio_ di Milano, riceve il terzo premio per l'opera _El duelo_.
    - Nel 2011 riceve una targa di riconoscimento per la diffusione della cultura argentina a Milano, consegnata dal sindaco Letizia Moratti.
    - Nel 2012 l'ambasciatore e console argentino a Milano Gustavo Moreno gli conferisce una medaglia di riconoscimento per la sua arte e per la diffusione della cultura argentina a Milano.
    - Nel 2012 ottiene il primo premio al 5° Simposio Milano Art Festival International con l'opera _Buenos Aires, Paris, Buenos Aires_.
    - Nel 2025 l'ambasciatore e console argentino a Milano Luis Pablo Niscovolos gli consegna un attestato di riconoscimento per i suoi 25 anni come rappresentante della cultura argentina in Italia, per la sua arte pittorica e per la diffusione del tango argentino.

    Nel 2026 la nostalgia per i suoi affetti e per la sua città natale lo porta a decidere di tornare definitivamente a Mar del Plata, dove prosegue la sua vita artistica e nuovi progetti legati all'arte, portando con sé molto dell'esperienza vissuta in Europa, soprattutto a Milano.
  es: |-
    Alejandro Juan Ferrante nació en Mar del Plata, Argentina, en 1956.

    Cursó sus estudios primarios en la Escuela n.º 1 «Pascuala Mugaburu», continuó su educación secundaria en la Escuela de Comercio «Mariano Moreno» de Mar del Plata y, en 1984, obtuvo el título de arquitecto por la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    Durante sus años de formación, realizó un curso de fotografía en la Academia de Fotografía de Mar del Plata y participó en diversas exposiciones, encuentros y concursos. Obtuvo el primer premio por su obra \*Una ventana al pasado\*, otorgado por un jurado de arquitectos, y el primer premio por su obra \*Soledad\*, concedido por un jurado de fotógrafos.

    En Argentina, ejerció como arquitecto —diseñando y supervisando diversos proyectos— y fue docente en la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    En 1988, se trasladó a Buenos Aires para desarrollar varios proyectos arquitectónicos y comenzó a dedicarse a la pintura. Por esa misma época, desarrolló una gran pasión por la danza y la cultura del tango; lo estudió durante años, y esta disciplina ha influido profundamente en su expresión artística a través de la pintura.

    A su regreso a Mar del Plata, continuó con sus diversas actividades artísticas y culturales.
    Entre finales del año 2000 y principios de 2001, tras haber obtenido la ciudadanía italiana, se trasladó a Italia y se estableció en Milán.

    En Milán, trabajó tanto como arquitecto como instructor de tango, organizando espectáculos en teatros de la ciudad e impartiendo clases de tango en diversos espacios culturales.

    Como pintor, ha expuesto su obra en galerías, museos y centros culturales bajo el auspicio del Consulado de Argentina en Milán, con el cual sigue colaborando estrechamente en iniciativas culturales.

    En pintura obtuvo diversos reconocimientos y premios:

    - Su pintura _El tormento del fueye_ está en exhibición permanente desde 2009 en la Galería de Arte Moderno Aroldo Bonzagni en Cento, Ferrara.
    - La obra _El tango de Argentina al mundo_ se exhibe desde 2011 en el Consulado de la República Argentina en Milán.
    - En 2006, en la exposición _Arte sul Naviglio_ de Milán, recibió el tercer premio por su obra _El duelo_.
    - En 2011 recibió una placa de reconocimiento por la difusión de la cultura argentina en Milán de manos de la alcaldesa Letizia Moratti.
    - En 2012 el embajador y cónsul de Argentina en Milán, Gustavo Moreno, lo premió con una medalla de reconocimiento por su arte y difusión de la cultura argentina en Milán.
    - En 2012 obtuvo el primer premio en el 5.º Simposio Milano Art Festival International con su obra _Buenos Aires, Paris, Buenos Aires_.
    - En 2025 el embajador y cónsul de Argentina en Milán, Luis Pablo Niscovolos, le entregó un certificado de reconocimiento por sus 25 años como representante de la cultura argentina en Italia, por su arte pictórico y por la difusión del tango argentino.

    En 2026, la nostalgia por sus afectos y su ciudad natal lo lleva a decidir regresar en forma permanente a Mar del Plata, donde continuará con su vida artística y futuros proyectos afines al arte, llevando consigo mucho de la experiencia vivida en Europa, principalmente en Milán.
