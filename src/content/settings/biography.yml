text:
  en: |-
    Alejandro Juan Ferrante was born in Mar del Plata, Argentina, in 1956.

    He attended the Pascuala Mugaburu Primary School (No. 1), continued his secondary education at the Mariano Moreno Commercial School in Mar del Plata, and earned a degree in architecture in 1984 from the Faculty of Architecture and Urban Planning of Mar del Plata.

    During his studies, he took a photography course at the Mar del Plata Photography Academy and participated in various exhibitions, gatherings, and competitions. He won first prize for his work \*Una ventana al pasado\* ("A Window to the Past"), awarded by a jury of architects, and first prize for his work \*Soledad\* ("Solitude"), awarded by a jury of photographers.

    In Argentina, he practiced as an architect—designing and overseeing various architectural projects—and taught at the Faculty of Architecture and Urban Planning in Mar del Plata.

    In 1988, he moved to Buenos Aires for several architectural projects and began to devote himself to painting. During this same period, he developed a passion for the dance and culture of the tango; he studied it for years, and it has profoundly influenced his artistic expression in painting.

    Upon returning to Mar del Plata, he continued his various artistic and cultural pursuits.

    Between late 2000 and early 2001, having already obtained Italian citizenship, he moved to Italy and settled in Milan.

    In Milan, he worked as both an architect and a tango instructor, staging performances in the city's theaters and teaching tango in various cultural spaces.

    As a painter, he has exhibited his work in galleries, museums, and cultural centers under the patronage of the Argentine Consulate in Milan, with which he continues to collaborate closely on cultural initiatives.

    His painting has earned him a number of honours and awards:

    - Since 2009 his painting _El tormento del fueye_ has been on permanent display at the Aroldo Bonzagni Gallery of Modern Art in Cento (Ferrara).
    - Since 2011 his work _El tango de Argentina al mundo_ has been on display at the Consulate of the Argentine Republic in Milan.
    - In 2006 he won third prize for _El duelo_ at the exhibition _Arte sul Naviglio_ in Milan.
    - In 2011 he received a plaque of recognition for promoting Argentine culture in Milan, presented by the Mayor, Letizia Moratti.
    - In 2012 the Ambassador and Consul of Argentina in Milan, Gustavo Moreno, awarded him a medal of recognition for his art and for promoting Argentine culture in Milan.
    - In 2012 he won first prize at the 5th Symposium Milano Art Festival International with his work _Buenos Aires, Paris, Buenos Aires_.
    - In 2025 the Ambassador and Consul of Argentina in Milan, Luis Pablo Niscovolos, presented him with a certificate of recognition for his 25 years as a representative of Argentine culture in Italy, for his painting and for promoting Argentine tango.

    In 2026, longing for his loved ones and his home town, he decided to return permanently to Mar del Plata, where he will carry on his artistic life and future art projects, bringing with him much of what he lived in Europe, above all in Milan.
  it: |-
    Alejandro Juan Ferrante nasce a Mar del Plata, in Argentina, nel 1956.

     Si laurea in architettura nel 1984 alla Facultà di Architettura e Urbanistica di Mar del Plata.

    Durante gli studi segue un corso di fotografia all'Accademia di Fotografia di Mar del Plata e partecipa a diverse mostre, incontri e concorsi. Ottiene il primo premio per l'opera _Una ventana al pasado_, assegnato da una giuria di architetti, e il primo premio per l'opera _Soledad_, conferito da una giuria di fotografi.

    In Argentina esercita la professione di architetto, progetta e dirige diverse opere architettoniche e insegna all'Università di Architettura e Urbanistica di Mar del Plata.

    Nel 1988 si trasferisce a Buenos Aires per alcuni progetti di architettura e inizia a dedicarsi anche alla pittura. Negli stessi anni nasce la sua passione per il ballo e la cultura del tango, che studia per anni e che influenzarà profondamente la sua espressione pittorica.

    En Mar del Plata, prosegue tutta la sua attività artistica.

    Nel 2001, come cittadino italiano, si stabilisce in Italia a Milano.

    A Milano esercita come architetto, insegna tango in spazi culturali e realizza spettacoli teatrali. Esponi i suoi dipinti in gallerie, musei e centri culturali con il patrocinio del Consolato Argentino di Milano, con cui collaborare assiduamente.

    Nel 2026 torna definitivamente a Mar del Plata, continuando con la sua creatività arricchita dall' esperienza vissuta in Europa, soprattutto a Milano.

    In pittura ottiene diversi riconoscimenti e premi:

    - Il dipinto _El tormento del fueye_ è esposto in modo permanente dal 2009 alla Galleria d'Arte Moderna Aroldo Bonzagni di Cento (Ferrara).
    - L'opera _El tango de Argentina al mundo_ è esposta dal 2011 al Consolato della Repubblica Argentina a Milano.
    -  2006, alla mostra _Arte sul Naviglio_ di Milano, riceve il terzo premio per l'opera _El duelo_.
    -  2011 riceve una targa di riconoscimento per la diffusione della cultura argentina a Milano, consegnata dal sindaco Letizia Moratti.
    - 2012 l'ambasciatore e console argentino a Milano Gustavo Moreno gli conferisce una medaglia di riconoscimento per la sua arte e per la diffusione della cultura argentina a Milano.
    -  2012 ottiene il primo premio al 5° Simposio Milano Art Festival International con l'opera _Buenos Aires, Paris, Buenos Aires_.
    -  2025 l'ambasciatore e console argentino a Milano Luis Pablo Niscovolos gli consegna un attestato di riconoscimento per i suoi 25 anni come rappresentante della cultura argentina in Italia, per la sua arte pittorica e per la diffusione del tango argentino.
  es: |-
    Alejandro Juan Ferrante nació en Mar del Plata, Argentina, en 1956.

    Obtuvo su título de arquitecto en 1984 en la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    Durante sus estudios, realizó un curso de fotografía en la Academia de Fotografía de Mar del Plata y participó en diversas exposiciones, encuentros y concursos. Obtuvo el primer premio por su obra \*Una ventana al pasado\*, otorgado por un jurado de arquitectos, y el primer premio por su obra \*Soledad\*, concedido por un jurado de fotógrafos.

    En Argentina, ejerció como arquitecto —diseñando y supervisando diversos proyectos— y fue docente en la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    En 1988, se trasladó a Buenos Aires para desarrollar varios proyectos arquitectónicos y comenzó a dedicarse también a la pintura. Durante esa misma etapa, desarrolló una pasión por la danza y la cultura del tango —tema que estudió durante años—, lo cual influiría profundamente en su expresión artística a través de la pintura.

    Continuó con su labor artística en Mar del Plata.

    En 2001, en su calidad de ciudadano italiano, se radicó en Milán, Italia.

    En Milán, trabajó como arquitecto, impartió clases de tango en espacios culturales y produjo espectáculos teatrales. Expuso sus pinturas en galerías, museos y centros culturales bajo el auspicio del Consulado Argentino en Milán, con el cual colaboró ​​estrechamente.

    En 2006, regresó definitivamente a Mar del Plata, donde continuó su trabajo creativo, enriquecido por las experiencias vividas en Europa, especialmente en Milán.

    Ha recibido diversos reconocimientos y premios por su pintura:

    Su obra \*El tormento del fueye\* forma parte, desde 2009, de la colección permanente de la Galería de Arte Moderno Aroldo Bonzagni, en Cento (Ferrara). La obra \*El tango de Argentina al mundo\* se encuentra expuesta en el Consulado de la República Argentina en Milán desde 2011.

    2006, durante la exposición \*Arte sul Naviglio\* en Milán, recibió el tercer premio por su obra \*El duelo\*.

     2011, recibió una placa de reconocimiento por su labor en la difusión de la cultura argentina en Milán, entregada por la alcaldesa Letizia Moratti.

     2012, el embajador y cónsul argentino en Milán, Gustavo Moreno, le otorgó una medalla en reconocimiento a su arte y a sus esfuerzos por promover la cultura argentina en Milán.

     2012, obtuvo el primer premio en el 5.º \*Milano Art Festival International\* por su obra \*Buenos Aires, Paris, Buenos Aires\*.

     2025, el embajador y cónsul argentino en Milán, Luis Pablo Niscovolos, le hizo entrega de un certificado de reconocimiento por sus 25 años como representante de la cultura argentina en Italia, por su labor pictórica y por su papel en la promoción del tango argentino.

