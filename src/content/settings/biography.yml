text:
  en: |-
    Alejandro Juan Ferrante was born in Mar del Plata, Argentina, in 1956.

    He earned his degree in architecture in 1984 from the Faculty of Architecture and Urbanism in Mar del Plata.

    During his studies, he took a photography course at the Mar del Plata Academy of Photography and participated in various exhibitions, gatherings, and competitions. He won first prize for his work \*Una ventana al pasado\* (A Window to the Past), awarded by a jury of architects, and first prize for his work \*Soledad\* (Solitude), awarded by a jury of photographers.

    In Argentina, he practiced as an architect, designing and overseeing various architectural projects, and taught at the Faculty of Architecture and Urbanism in Mar del Plata.

    In 1988, he moved to Buenos Aires for several architectural projects and began to devote himself to painting as well. During this same period, he developed a passion for the dance and culture of tango—a subject he studied for years—which would go on to profoundly influence his artistic expression in painting.

    He continued his artistic pursuits in Mar del Plata.

    In 2001, as an Italian citizen, he relocated to Milan, Italy.

    In Milan, he worked as an architect, taught tango in cultural spaces, and produced theatrical performances. He exhibited his paintings in galleries, museums, and cultural centers under the patronage of the Argentine Consulate in Milan, with whom he collaborated extensively.

    In 2006, he returned permanently to Mar del Plata, continuing his creative work, now enriched by the experiences he gained in Europe—most notably in Milan.

    He has received various accolades and awards for his painting:

    . His painting \*El tormento del fueye\* (The Torment of the Bellows) has been on permanent display since 2009 at the Aroldo Bonzagni Gallery of Modern Art in Cento (Ferrara). 

    The work \*El tango de Argentina al mundo\* has been on display at the Consulate of the Argentine Republic in Milan since 2011.

    . 2006, at the \*Arte sul Naviglio\* exhibition in Milan, he received the third prize for his work \*El duelo\*.

    .  2011, he received a plaque of recognition for promoting Argentine culture in Milan, presented by Mayor Letizia Moratti.

    . 2012, the Argentine Ambassador and Consul in Milan, Gustavo Moreno, awarded him a medal in recognition of his art and his efforts to promote Argentine culture in Milan.

    . 2012, he won first prize at the 5th \*Milano Art Festival International\* symposium for his work \*Buenos Aires, Paris, Buenos Aires\*.

    .  2025, the Argentine Ambassador and Consul in Milan, Luis Pablo Niscovolos, presented him with a certificate of recognition for his 25 years as a representative of Argentine culture in Italy, for his painting, and for his role in promoting the Argentine tango.
  it: |-
    Alejandro Juan Ferrante nasce a Mar del Plata, in Argentina, nel 1956.

     Si laurea in architettura nel 1984 alla Facultà di Architettura e Urbanistica di Mar del Plata.

    Durante gli studi segue un corso di fotografia all'Accademia di Fotografia di Mar del Plata e partecipa a diverse mostre, incontri e concorsi. Ottiene il primo premio per l'opera _Una ventana al pasado_, assegnato da una giuria di architetti, e il primo premio per l'opera _Soledad_, conferito da una giuria di fotografi.

    In Argentina esercita la professione di architetto, progetta e dirige diverse opere architettoniche e insegna all'Università di Architettura e Urbanistica di Mar del Plata.

    Nel 1988 si trasferisce a Buenos Aires per alcuni progetti di architettura e inizia a dedicarsi anche alla pittura. Negli stessi anni nasce la sua passione per il ballo e la cultura del tango, che studia per anni e che influenzerà profondamente la sua espressione pittorica.

    A Mar del Plata, prosegue tutta la sua attività artistica.

    Nel 2001 come cittadino italiano si stabilisce in Italia a Milano.

    A Milano esercita come architetto, insegna tango in spazi culturali e realizza spettacoli teatrali. Espone i suoi dipinti in gallerie, musei e centri culturali con il patrocinio del Consolato Argentino di Milano, con cui collaborare assiduamente.

    Nel 2026 torna definitivamente a Mar del Plata, continuando con la sua creatività arricchita dall' esperienza vissuta in Europa, soprattutto a Milano.

    In pittura ottiene diversi riconoscimenti e premi:

    - Il dipinto _El tormento del fueye_ è esposto in modo permanente dal 2009 alla Galleria d'Arte Moderna Aroldo Bonzagni di Cento (Ferrara).
    - L'opera _El tango de Argentina al mundo_ è esposta dal 2011 al Consolato della Repubblica Argentina a Milano.
    -  2006 - Terzo premio per l'opera _El duelo, alla mostra Arte sul Naviglio a Milano_
    -  2011 - Il sindaco di Milano Letizia Moratti gli consegna una targa di riconoscimento per la diffusione della cultura argentina a Milano.
    - 2012 -  L'ambasciatore e console argentino a Milano Gustavo Moreno gli conferisce una medaglia di riconoscimento per la sua arte e per la diffusione della cultura argentina a Milano.
    -  2012 - Primo premio al 5° Simposio Milano Art Festival International con l'opera _Buenos Aires, Paris, Buenos Aires_.
    -  2025 -  L'ambasciatore e console argentino a Milano Luis Pablo Niscovolos gli consegna un attestato di riconoscimento per i suoi 25 anni come rappresentante della cultura argentina in Italia, per la sua arte pittorica e per la diffusione del tango argentino.
  es: |-
    Alejandro Juan Ferrante nació en Mar del Plata, Argentina, en 1956.

    Obtuvo su título de arquitecto en 1984 en la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    Durante sus estudios, realizó un curso de fotografía en la Academia de Fotografía de Mar del Plata y participó en diversas exposiciones, encuentros y concursos. Obtuvo el primer premio por su obra \*Una ventana al pasado\*, otorgado por un jurado de arquitectos, y el primer premio por su obra \*Soledad\*, concedido por un jurado de fotógrafos.

    En Argentina, ejerció como arquitecto —diseñando y supervisando diversos proyectos— y fue docente en la Facultad de Arquitectura y Urbanismo de Mar del Plata.

    En 1988, se trasladó a Buenos Aires para desarrollar varios proyectos arquitectónicos y comenzó a dedicarse también a la pintura. Durante esa misma etapa, desarrolló una pasión por la danza y la cultura del tango —tema que estudió durante años—, lo cual influiría profundamente en su expresión artística a través de la pintura.

    Continuó con su labor artística en Mar del Plata.

    En 2001, en su calidad de ciudadano italiano, se radicó en Milán, Italia.

    En Milán, trabajó como arquitecto, impartió clases de tango en espacios culturales y produjo espectáculos teatrales. Expuso sus pinturas en galerías, museos y centros culturales bajo el auspicio del Consulado Argentino en Milán, con el cual colaboró ​​estrechamente.

    En 2006, regresó definitivamente a Mar del Plata, donde continuó su trabajo creativo, enriquecido por las experiencias vividas en Europa, especialmente en Milán.

    Ha recibido diversos reconocimientos y premios por su pintura:

    Su obra \*El tormento del fueye\* forma parte, desde 2009, de la colección permanente de la Galería de Arte Moderno Aroldo Bonzagni, en Cento (Ferrara).

     La obra \*El tango de Argentina al mundo\* se encuentra expuesta en el Consulado de la República Argentina en Milán desde 2011.

    2006, durante la exposición \*Arte sul Naviglio\* en Milán, recibió el tercer premio por su obra \*El duelo\*.

     2011, recibió una placa de reconocimiento por su labor en la difusión de la cultura argentina en Milán, entregada por la alcaldesa Letizia Moratti.

     2012, el embajador y cónsul argentino en Milán, Gustavo Moreno, le otorgó una medalla en reconocimiento a su arte y a sus esfuerzos por promover la cultura argentina en Milán.

     2012, obtuvo el primer premio en el 5.º \*Milano Art Festival International\* por su obra \*Buenos Aires, Paris, Buenos Aires\*.

     2025, el embajador y cónsul argentino en Milán, Luis Pablo Niscovolos, le hizo entrega de un certificado de reconocimiento por sus 25 años como representante de la cultura argentina en Italia, por su labor pictórica y por su papel en la promoción del tango argentino.

