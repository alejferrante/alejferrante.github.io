# Pubblica il sito su GitHub Pages ogni volta che qualcosa cambia sul ramo "main"
# (anche quando si salva dal pannello /admin). Richiede circa 1–2 minuti.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7
      - name: Costruisci il sito
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Metti online
        id: deployment
        uses: actions/deploy-pages@v5
